# Homelab: FastAPI + Postgres on one Proxmox VM (4 vCPU / ~6 GB RAM, 5.7 GiB usable).
# Current VM: counterstrike (192.168.4.54, headless Debian 13).
# Public API: https://api-site.csgooner.com via Cloudflare Tunnel. cloudflared
# runs on the HOST as a systemd service (dashboard install script), and its
# public-hostname service is http://localhost:8000, so the api service MUST stay
# published on 127.0.0.1:8000. The compose cloudflared sidecar (profile
# "tunnel") is NOT used. Caddy (profile "edge") is a grey-cloud fallback only.
# Postgres is never public: compose network + 127.0.0.1 only.
# See docs/deploy-homelab.md.
# API/db containers cap json-file logs (10m x 3) so parse failures cannot fill the VM disk.
#
# From the repository root on the VM (no --profile flags):
#   cp deploy/homelab/.env.example deploy/homelab/.env   # edit secrets
#   docker compose -f deploy/homelab/docker-compose.yml --env-file deploy/homelab/.env up -d --build

name: cs-analytics-homelab

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csgooners}
      POSTGRES_USER: ${POSTGRES_USER:-csgooners}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/homelab/.env}
    volumes:
      - csa-pgdata:/var/lib/postgresql/data
    # Bind to loopback only for admin tools on the VM. Do not map 0.0.0.0:5432.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - csa

  api:
    build:
      context: ../..
      dockerfile: deploy/homelab/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-csgooners}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-csgooners}
      # Compose overrides keep CORS / public URLs consistent with production.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api-site.csgooner.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://csgooner.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://csgooner.com,https://www.csgooner.com,http://localhost:5173,http://127.0.0.1:5173}
      UPLOAD_JOB_DIR: /var/lib/csa/upload-jobs
      PORT: "8000"
    volumes:
      - csa-upload-jobs:/var/lib/csa/upload-jobs
    # Host cloudflared (systemd) -> http://localhost:8000 reaches the API here.
    # Keep it on loopback; do not change to 0.0.0.0 / "8000:8000".
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - csa

  # Nightly-ish pg_dump of csa-pgdata into a separate volume (not the data dir).
  # Runs once on start, then every 24h. For calendar 03:15 local, use the host
  # timer units in this directory instead (and scale this service to 0).
  db-backup:
    image: postgres:17
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-csgooners}
      POSTGRES_DB: ${POSTGRES_DB:-csgooners}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/homelab/.env}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - csa-pg-backups:/backups
      - ./backup-pg.sh:/usr/local/bin/backup-pg.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "db-backup: starting (keep ${BACKUP_KEEP_DAYS:-14} days)"
        /usr/local/bin/backup-pg.sh || echo "db-backup: initial dump failed (will retry)" >&2
        while true; do
          sleep 86400
          /usr/local/bin/backup-pg.sh || echo "db-backup: scheduled dump failed" >&2
        done
    networks:
      - csa

  # NOT USED on counterstrike: cloudflared runs on the host as a systemd service.
  # Do not start this profile alongside it (it would add a second connector).
  # Only for a stack without host cloudflared: tunnel public hostname
  # api-site.csgooner.com -> http://api:8000, token in .env, then:
  #   docker compose -f deploy/homelab/docker-compose.yml --env-file deploy/homelab/.env --profile tunnel up -d
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Token required when starting --profile tunnel (compose interpolates even if profile off,
    # so we do not use :? here — cloudflared fails fast if TUNNEL_TOKEN is empty).
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      api:
        condition: service_healthy
    networks:
      - csa

  # Optional HTTPS edge on the VM (Let's Encrypt). Fallback when Tunnel upload
  # limits are a problem — requires 80/443 + DDNS (home IP is usually dynamic).
  #   docker compose -f deploy/homelab/docker-compose.yml --env-file deploy/homelab/.env --profile edge up -d
  # Only one host on the WAN IP can bind 80/443; for a shared lab edge proxy,
  # skip this profile and proxy to VM_LAN_IP:8000 instead (see docs).
  caddy:
    profiles: ["edge"]
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - csa-caddy-data:/data
      - csa-caddy-config:/config
    networks:
      - csa

volumes:
  csa-pgdata:
  csa-pg-backups:
  csa-upload-jobs:
  csa-caddy-data:
  csa-caddy-config:

networks:
  csa:
    driver: bridge
