services:
  - type: web
    name: csgooners-prediction-api
    runtime: python
    plan: free
    buildCommand: pip install -r services/prediction_api/requirements.txt
    startCommand: uvicorn main:app --app-dir services/prediction_api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGINS
        value: https://csgooners.com,https://www.csgooners.com,http://localhost:5173,http://127.0.0.1:5173
