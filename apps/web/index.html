<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d12" />
    <meta name="description" content="Explore CS2 round outcomes with a match prediction model trained on professional rounds." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" type="image/svg+xml" href="/favicon.svg" />
    <!-- Paint the dark page and the brand bar before the app bundle runs (no blank / white flash). -->
    <style>
      html,body{margin:0;background:#090d12;color:#f2f3f0}
      .boot-bar{height:78px;border-bottom:1px solid #202830;display:flex;align-items:center;gap:11px;padding:0 clamp(22px,6.2vw,100px);
        font:800 20px/1 'Barlow Condensed',sans-serif;letter-spacing:.055em;max-width:1600px;margin:0 auto;box-sizing:border-box}
      .boot-bar img{width:28px;height:28px}
      .boot-bar span{font-weight:500;color:#b9c1c8}
    </style>
    <!-- Fonts: linked here (not @import in CSS) so the browser fetches them in parallel with the app
         CSS instead of after it; only the weights the CSS uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" />
    <title>CS Gooner - Round Predictor</title>
  </head>
  <body>
    <div id="root"><div class="boot-bar" aria-hidden="true"><img src="/favicon.svg" alt="" />CS <span>GOONER</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
