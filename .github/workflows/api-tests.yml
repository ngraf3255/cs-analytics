name: API tests

on:
  pull_request:
    paths:
      - "services/prediction_api/**"
      - "model.pkl"
      - "render.yaml"
      - ".github/workflows/api-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/prediction_api/**"
      - "model.pkl"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: csa
          POSTGRES_PASSWORD: csa_ci_only
          POSTGRES_DB: csa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U csa" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/prediction_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/prediction_api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Real CS2 test demo (demoparser2 fixture, not committed)
        uses: actions/cache@v4
        with:
          path: /tmp/test_demo.dem
          key: demoparser2-test-demo-84a1a419
      - run: test -f /tmp/test_demo.dem || curl -fsSL -o /tmp/test_demo.dem https://raw.githubusercontent.com/LaihoE/demoparser/main/src/parser/test_demo.dem
      - name: pytest
        env:
          CSA_TEST_DEMO: /tmp/test_demo.dem
          # Throwaway CI database; each test gets its own schema.
          CSA_TEST_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgresql://csa:csa_ci_only@127.0.0.1:5432/csa_test' || '' }}
        run: pytest -q
